[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lector-pdf"
description = "Free, offline PDF reader, study tool, form filler and signer for Windows."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dynamic = ["version"]
# Runtime dependencies are pinned exactly so every test build is reproducible.
# Update them on purpose, one at a time, in their own pull request.
dependencies = [
    # Qt for Python, LGPL-3.0. "Essentials" only: the full PySide6 package also
    # pulls in WebEngine (a whole web browser) and other add-ons we do not use.
    "PySide6_Essentials==6.12.0",
    # PDF engine, AGPL-3.0. Version 2 also installs machine-learning layout
    # tools (onnxruntime, numpy, model files). The program does not use them and
    # packaging/build.py leaves them out of the Windows program.
    "PyMuPDF==2.1",
    # Certificate signatures (PAdES), MIT.
    "pyHanko==0.38.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]
# Only needed to create the Windows program (GitHub does this automatically).
build = [
    # Turns the Python code into a Windows program. GPL with an exception that
    # allows distributing the result under any licence. Not shipped to users.
    "pyinstaller==6.22.3",
]

[project.gui-scripts]
lector-pdf = "app.main:main"

[tool.setuptools]
packages = ["app", "app.core", "app.ui"]

[tool.setuptools.package-data]
app = ["recursos/tessdata/*", "recursos/interfaz/*"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
