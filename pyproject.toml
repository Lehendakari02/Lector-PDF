[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lector-pdf"
description = "Free, offline PDF reader, study tool, form filler and signer for Windows."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dynamic = ["version"]
# Runtime dependencies are pinned exactly so every test build is reproducible.
# Update them on purpose, one at a time, in their own pull request.
dependencies = [
    # Qt for Python, LGPL-3.0. "Essentials" only: the full PySide6 package also
    # pulls in WebEngine (a whole web browser) and other add-ons we do not use.
    "PySide6_Essentials==6.12.0",
    # PDF engine, AGPL-3.0. Kept on the 1.x series on purpose: PyMuPDF 2.x
    # requires onnxruntime, numpy and bundled machine-learning layout models,
    # which this project neither needs nor wants (see CLAUDE.md, "Sin IA").
    "PyMuPDF==1.28.2",
    # Certificate signatures (PAdES), MIT.
    "pyHanko==0.38.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[project.gui-scripts]
lector-pdf = "app.main:main"

[tool.setuptools]
packages = ["app", "app.core", "app.ui"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
