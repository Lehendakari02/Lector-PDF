name: Pruebas

# Runs the automatic tests on Windows for every pull request and for main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Pruebas en Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/versiones-fijadas.txt
      - name: Install dependencies
        run: python -m pip install -e ".[dev]" -c packaging/versiones-fijadas.txt
      - name: Check code style
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run tests
        run: python -m pytest
